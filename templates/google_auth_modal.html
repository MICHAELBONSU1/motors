<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIG-L Autos - Continue with Google</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0b0f19;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #161e2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .logo-badge {
      width: 52px;
      height: 52px;
      background: #fff;
      color: #4285F4;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .input-box {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: #38bdf8;
    }
    .btn-connect {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-connect:hover {
      background: #1d4ed8;
    }
    .spinner {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">G</div>
    <h1>Continue with Google</h1>
    <p>Sign in or register your account with <b>BIG-L AUTOS</b></p>
    <div id="authContent">
      <form onsubmit="handleSubmit(event)">
        <input type="text" id="custName" class="input-box" placeholder="Your Name (optional)">
        <input type="email" id="custEmail" class="input-box" placeholder="Your Google / Gmail address" required autofocus>
        <button type="submit" class="btn-connect">Continue with Google</button>
      </form>
    </div>
    <div class="spinner" id="spinner"></div>
  </div>
  <script>
    async function handleSubmit(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('custEmail').value.trim();
      let name = document.getElementById('custName').value.trim();
      if (!name) name = email.split('@')[0];
      document.getElementById('authContent').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      try {
        const res = await fetch('/api/auth/social-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: 'google', email: email, name: name })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          const targetUrl = data.redirect || (data.user && data.user.role === 'admin' ? '/admin' : '/customer');
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', user: data.user }, '*');
            try { window.close(); } catch(e){}
          }
          setTimeout(() => { window.location.href = targetUrl; }, 150);
        } else {
          alert(data.error || 'Sign in failed');
          location.reload();
        }
      } catch(err) {
        alert('Connection error');
        location.reload();
      }
    }
  </script>
</body>
</html>
