<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>{{ 'Create Account' if mode == 'register' else 'Sign In' }} | BIG-L AUTOS</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-dark-green auth-page-body" style="background: #020704; min-height: 100vh; height: auto; overflow-x: hidden; overflow-y: auto !important; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column;">

  <!-- Minimal Luxury Header -->
  <header class="navbar auth-navbar" style="background: rgba(3, 13, 7, 0.9); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 14px 0;">
    <div class="container nav-inner" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/" class="brand-logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <div class="logo-symbol">
          <svg viewBox="0 0 100 100" width="30" height="30" style="overflow: visible;">
            <!-- Christmas Red Santa Cap (December Edition) -->
            <path d="M 23 16 Q 32 -3 47 -1 Q 61 1 68 8 Q 63 12 55 8 Q 41 5 25 15 Z" fill="#dc2626"/>
            <circle cx="68" cy="8" r="4.5" fill="#ffffff"/>
            <path d="M 20 17 Q 36 7 57 8 Q 57 13 36 12 Q 20 21 20 17 Z" fill="#ffffff"/>

            <circle cx="50" cy="50" r="44" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9"/>
            <path d="M 28 26 L 28 72 L 72 72" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M 33 62 C 36 54 44 48 54 48 C 63 48 70 53 74 62 L 75 66 L 32 66 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
            <circle cx="41" cy="66" r="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
            <circle cx="66" cy="66" r="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
            <path d="M 27 52 L 32 52 L 33 62" stroke="#ffffff" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 style="font-size: 17px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; margin: 0;">BIG-L AUTOS</h1>
        </div>
      </a>

      <div class="nav-actions">
        <a href="/" class="btn btn-secondary" style="padding: 7px 16px; font-size: 12.5px; font-weight: 600; border-radius: 6px; background: rgba(255,255,255,0.06); color: #ffffff; border: 1px solid rgba(255,255,255,0.12); text-decoration: none;">View Showroom</a>
      </div>
    </div>
  </header>

  <!-- Centered Luxury Auth Container (Scroll-friendly on all mobile screens) -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 16px 80px 16px; min-height: calc(100vh - 70px); height: auto;">
    <div style="width: 100%; max-width: 440px; margin: auto;">
      
      <div class="advanced-auth-container" style="background: #030d07; border: 1px solid rgba(52, 211, 153, 0.22); border-radius: 12px; padding: 32px 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.45); display: block;">
        
        <!-- Brand Emblem Header with December Santa Hat -->
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.25); margin-bottom: 12px;">
            <svg viewBox="0 0 100 100" width="34" height="34" style="overflow: visible;">
              <!-- Christmas Red Santa Cap (December Edition) -->
              <path d="M 23 16 Q 32 -3 47 -1 Q 61 1 68 8 Q 63 12 55 8 Q 41 5 25 15 Z" fill="#dc2626"/>
              <circle cx="68" cy="8" r="4.5" fill="#ffffff"/>
              <path d="M 20 17 Q 36 7 57 8 Q 57 13 36 12 Q 20 21 20 17 Z" fill="#ffffff"/>

              <circle cx="50" cy="50" r="44" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.95"/>
              <path d="M 28 26 L 28 72 L 72 72" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M 33 62 C 36 54 44 48 54 48 C 63 48 70 53 74 62 L 75 66 L 32 66 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
              <circle cx="41" cy="66" r="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
              <circle cx="66" cy="66" r="3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
              <path d="M 27 52 L 32 52 L 33 62" stroke="#ffffff" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <h2 style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; margin: 0 0 4px 0;">BIG-L AUTOS</h2>
          <p style="font-size: 12.5px; color: var(--gray-400); margin: 0;">Somanya-Roundabout Showroom</p>
        </div>

        {% if inquiry_car %}
        <!-- Clean Vehicle Inquired Pill -->
        <div style="background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.22); border-radius: 8px; padding: 10px 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px;">
          <img src="{{ inquiry_car.image_url }}" alt="{{ inquiry_car.title }}" style="width: 50px; height: 36px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--mint); font-weight: 700;">Vehicle Selected</div>
            <div style="font-size: 12.5px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ inquiry_car.title }}</div>
          </div>
        </div>
        {% endif %}

        <!-- Segmented Tab Switcher -->
        <div class="advanced-tab-switcher" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #020704; padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 22px;">
          <button type="button" class="adv-tab-btn {{ 'active' if mode == 'login' else '' }}" id="pageTabLogin" onclick="switchPageAuthMode('login')" style="padding: 8px 12px; font-size: 12.5px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s;">
            Sign In
          </button>
          <button type="button" class="adv-tab-btn {{ 'active' if mode == 'register' else '' }}" id="pageTabRegister" onclick="switchPageAuthMode('register')" style="padding: 8px 12px; font-size: 12.5px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; transition: all 0.2s;">
            Create Account
          </button>
        </div>

        <!-- Login Form -->
        <div id="pageLoginContainer" style="{{ 'display:block;' if mode == 'login' else 'display:none;' }}">
          <form onsubmit="handlePageLogin(event)">
            <div class="adv-form-group" style="margin-bottom: 14px;">
              <label class="adv-label" for="pageLoginEmail" style="font-size: 11px; letter-spacing: 0.8px; font-weight: 700; color: var(--gray-300); display: block; margin-bottom: 5px;">EMAIL ADDRESS</label>
              <input type="email" id="pageLoginEmail" class="adv-input" placeholder="you@example.com" required autocomplete="email" style="width: 100%; padding: 9px 12px; background: #020704; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #ffffff; font-size: 13px;">
            </div>

            <div class="adv-form-group" style="margin-bottom: 18px;">
              <label class="adv-label" for="pageLoginPassword" style="font-size: 11px; letter-spacing: 0.8px; font-weight: 700; color: var(--gray-300); display: block; margin-bottom: 5px;">PASSWORD</label>
              <div class="input-wrap has-toggle" style="position: relative;">
                <input type="password" id="pageLoginPassword" class="adv-input" placeholder="Enter your password" required autocomplete="current-password" style="width: 100%; padding: 9px 12px; padding-right: 50px; background: #020704; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #ffffff; font-size: 13px;">
                <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('pageLoginPassword', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--mint); font-size: 11px; cursor: pointer; padding: 4px;">Show</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; border-radius: 6px; cursor: pointer;">
              Sign In
            </button>
          </form>

          <div style="margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--gray-400);">
            Don't have an account? <a href="javascript:void(0)" onclick="switchPageAuthMode('register')" style="color: var(--mint); text-decoration: none; font-weight: 600;">Create one</a>
          </div>
        </div>

        <!-- Register Form -->
        <div id="pageRegisterContainer" style="{{ 'display:block;' if mode == 'register' else 'display:none;' }}">
          <form onsubmit="handlePageRegister(event)">
            <div class="adv-form-group" style="margin-bottom: 12px;">
              <label class="adv-label" for="pageRegName" style="font-size: 11px; letter-spacing: 0.8px; font-weight: 700; color: var(--gray-300); display: block; margin-bottom: 4px;">FULL NAME</label>
              <input type="text" id="pageRegName" class="adv-input" placeholder="e.g. David Mensah" required autocomplete="name" style="width: 100%; padding: 8px 12px; background: #020704; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #ffffff; font-size: 13px;">
            </div>

            <div class="adv-form-group" style="margin-bottom: 12px;">
              <label class="adv-label" for="pageRegEmail" style="font-size: 11px; letter-spacing: 0.8px; font-weight: 700; color: var(--gray-300); display: block; margin-bottom: 4px;">EMAIL ADDRESS</label>
              <input type="email" id="pageRegEmail" class="adv-input" placeholder="you@example.com" required autocomplete="email" style="width: 100%; padding: 8px 12px; background: #020704; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #ffffff; font-size: 13px;">
            </div>

            <div class="adv-form-group" style="margin-bottom: 12px;">
              <label class="adv-label" for="pageRegPhone" style="font-size: 11px; letter-spacing: 0.8px; font-weight: 700; color: var(--gray-300); display: block; margin-bottom: 4px;">PHONE NUMBER</label>
              <input type="tel" id="pageRegPhone" class="adv-input" placeholder="e.g. 0549255121" autocomplete="tel" style="width: 100%; padding: 8px 12px; background: #020704; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #ffffff; font-size: 13px;">
            </div>

            <div class="adv-form-group" style="margin-bottom: 18px;">
              <label class="adv-label" for="pageRegPassword" style="font-size: 11px; letter-spacing: 0.8px; font-weight: 700; color: var(--gray-300); display: block; margin-bottom: 4px;">PASSWORD</label>
              <div class="input-wrap has-toggle" style="position: relative;">
                <input type="password" id="pageRegPassword" class="adv-input" placeholder="At least 4 characters" required minlength="4" autocomplete="new-password" style="width: 100%; padding: 8px 12px; padding-right: 50px; background: #020704; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #ffffff; font-size: 13px;">
                <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('pageRegPassword', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--mint); font-size: 11px; cursor: pointer; padding: 4px;">Show</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; border-radius: 6px; cursor: pointer;">
              Create Your Account
            </button>
          </form>

          <div style="margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--gray-400);">
            Already have an account? <a href="javascript:void(0)" onclick="switchPageAuthMode('login')" style="color: var(--mint); text-decoration: none; font-weight: 600;">Sign In</a>
          </div>
        </div>

        <div style="margin-top: 24px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center;">
          <span style="font-size: 11.5px; color: var(--gray-500);">Somanya-Roundabout • Direct Line: 0549255121</span>
        </div>

      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/static/js/app.js?v=5.1"></script>
  <script>
    // Extract inquiry car id from URL if present
    const urlParams = new URLSearchParams(window.location.search);
    const inquiryCarId = urlParams.get('car_id');

    function switchPageAuthMode(mode) {
      const regContainer = document.getElementById('pageRegisterContainer');
      const loginContainer = document.getElementById('pageLoginContainer');
      const regTab = document.getElementById('pageTabRegister');
      const loginTab = document.getElementById('pageTabLogin');

      const carParam = inquiryCarId ? `?car_id=${encodeURIComponent(inquiryCarId)}` : '';

      if (mode === 'register') {
        regContainer.style.display = 'block';
        loginContainer.style.display = 'none';
        regTab.classList.add('active');
        loginTab.classList.remove('active');
        window.history.replaceState(null, '', '/register' + carParam);
        document.title = 'Create Account | BIG-L AUTOS';
      } else {
        regContainer.style.display = 'none';
        loginContainer.style.display = 'block';
        loginTab.classList.add('active');
        regTab.classList.remove('active');
        window.history.replaceState(null, '', '/login' + carParam);
        document.title = 'Sign In | BIG-L AUTOS';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = 'Hide';
      } else {
        input.type = 'password';
        btn.innerText = 'Show';
      }
    }

    async function handlePageRegister(e) {
      e.preventDefault();
      const name = document.getElementById('pageRegName').value.trim();
      const email = document.getElementById('pageRegEmail').value.trim();
      const phone = document.getElementById('pageRegPhone').value.trim();
      const password = document.getElementById('pageRegPassword').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message, 'success');
          if (inquiryCarId) {
            await startInquiryAndRedirect(inquiryCarId);
          } else {
            window.location.href = '/customer';
          }
        } else {
          showToast(data.error || 'Registration failed', 'info');
        }
      } catch (err) {
        showToast('Connection error', 'info');
      }
    }

    async function handlePageLogin(e) {
      e.preventDefault();
      const email = document.getElementById('pageLoginEmail').value.trim();
      const password = document.getElementById('pageLoginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message, 'success');
          if (data.user && data.user.role === 'admin') {
            window.location.href = '/admin';
          } else if (inquiryCarId) {
            await startInquiryAndRedirect(inquiryCarId);
          } else {
            window.location.href = '/customer';
          }
        } else {
          showToast(data.error || 'Invalid credentials', 'info');
        }
      } catch (err) {
        showToast('Connection error', 'info');
      }
    }

    async function startInquiryAndRedirect(carId) {
      try {
        const res = await fetch('/api/inquiries/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ car_id: carId })
        });
        const data = await res.json();
        if (data.success && data.chat_id) {
          window.location.href = `/customer?chat_id=${data.chat_id}`;
        } else {
          window.location.href = '/customer';
        }
      } catch (e) {
        window.location.href = '/customer';
      }
    }
  </script>
</body>
</html>
